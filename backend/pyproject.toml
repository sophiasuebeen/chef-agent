[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
agent = [
    "google-genai>=1.50,<2",  # Optional Gemini priority-rule evolution in evaluation/evolve.py.
    "openai-agents>=0.10,<1",
    "python-dotenv>=1,<2",
]
api = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1", # Required by FastAPI's TestClient in backend/tests.
]

[dependency-groups]
# Development checks only; not needed to run the simulator, API or game.
dev = [
    "ruff>=0.8,<1",
    "import-linter>=2,<3",
]
