name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install backend (agent + api extras, dev tools)
        run: uv sync --project backend --extra agent --extra api --locked

      - name: Lint (ruff)
        run: backend/.venv/bin/ruff check .

      - name: Layer rules (import-linter)
        run: PYTHONPATH=backend/src backend/.venv/bin/lint-imports

      - name: Offline backend tests (no credentials, no provider calls)
        run: backend/.venv/bin/python scripts/run_tests.py

      - name: Scripted baseline
        run: PYTHONPATH=backend/src backend/.venv/bin/python scripts/run_local.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm --prefix frontend ci

      - name: Frontend tests (replays fresh API output via the backend venv)
        run: npm --prefix frontend test

      - name: Frontend build
        run: npm --prefix frontend run build
